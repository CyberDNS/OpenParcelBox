name: Build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    # This name is the required status check in the main branch ruleset —
    # rename both together.
    name: Firmware build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install platformio

      # building_config.h is per-installation and not in git.
      - run: cp include/building_config.h.example include/building_config.h

      - run: pio run
