</g>
<text x="30" y="605" font-size="12" font-weight="bold" fill="#202124">Servo</text>
<text x="120" y="605" font-size="12" fill="#202124">Signal (orange) → header pin 5 (GPIO21). V+ (red) and GND (brown) go to the external supply only.</text>
<text x="120" y="625" font-size="12" fill="#202124">Supply GND → header pin 3, so servo, supply and board share one ground. Nothing else from the servo goes to the board.</text>
<text x="30" y="645" font-size="12" font-weight="bold" fill="#202124">Letter flap</text>
<text x="120" y="645" font-size="12" fill="#202124">Reed contact between header pin 16 (GPIO17) and pin 4 (GND). No resistor needed (internal pull-up).</text>
<text x="120" y="665" font-size="12" fill="#202124">Flap shut: magnet near, contact closed, GPIO17 LOW. Flap open: contact open, GPIO17 HIGH.</text>
</svg>