; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-touch-lcd-35]
; Back on the official registry platform (Arduino-ESP32 core 2.0.17). The
; pioarduino/platform-espressif32 fork (core 3.3.9) got the display working
; at the SPI level (fillScreen reached the panel) but LVGL's partial-redraw
; path (dispFlush -> draw16bitRGBBitmap) never did, despite being called with
; correct coordinates every time. Rather than debug further into the GFX
; library's bulk-write path on the new core, reverting to the core/library
; combination that was actually proven working end-to-end.
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
build_flags = 
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DLV_CONF_INCLUDE_SIMPLE
	-Iinclude
debug_tool = esp-builtin
debug_init_break = tbreak setup
monitor_speed = 115200
; Decodes crash backtraces (Guru Meditation) to source lines in the serial monitor.
monitor_filters = esp32_exception_decoder
upload_speed = 921600
lib_deps = 
	lvgl/lvgl@8.4.0
	; Pinned to match core 2.0.17 — see notes further up. Newer releases of
	; these two either fail to compile (GFX needs esp32-hal-periman.h, a 3.x
	; header) or pick a peripheral path never validated against this core
	; (ESP32Servo 3.x's MCPWM backend).
	moononournation/GFX Library for Arduino@1.5.5
	lewisxhe/SensorLib@^0.3.1
	lewisxhe/XPowersLib@^0.2.9
	robtillaart/TCA9554@^0.1.2
	bblanchon/ArduinoJson@^7.0.0
	knolleary/PubSubClient@^2.8
	; 2.x requires the IDF5-era BT controller blob this core doesn't have —
	; crashes with a LoadProhibited panic during NimBLEDevice::init().
	h2zero/NimBLE-Arduino@^1.4.1
	madhephaestus/ESP32Servo@0.13.0
